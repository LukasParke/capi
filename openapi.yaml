openapi: 3.0.3
info:
  title: CEC HTTP Bridge API
  description: |
    REST API for controlling HDMI-CEC devices. Use this API to power on/off
    TVs and devices, control volume, switch inputs (HDMI ports), send remote
    key presses, send raw CEC commands, and manage MQTT settings. Intended
    for home automation, media centers, and scripting.
  version: 1.2.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080/api
    description: Local (default)
  - url: http://{host}:8080/api
    description: Network
    variables:
      host:
        default: localhost

tags:
  - name: Devices
    description: CEC device discovery and info
  - name: Power
    description: Power on/off and status
  - name: Volume
    description: Volume and mute
  - name: Source
    description: Active source and HDMI input
  - name: Navigation
    description: Send key presses (remote control)
  - name: Raw
    description: Raw CEC commands
  - name: System
    description: Topology, audio status, logs, health, events, bus steward state, and updates
  - name: Bus
    description: Cached CEC bus snapshot, deep scans, and optional frame capture
  - name: Settings
    description: MQTT and service configuration

paths:
  /devices:
    get:
      tags: [Devices]
      summary: List CEC devices
      description: |
        Returns devices from the **bus steward** cache when neither `live` nor `rescan`
        is set and a recent scan is available (fast). With an empty cache and no query
        flags, the server runs a **light** reconcile (no `RescanDevices`, still polls
        addresses and `GetDeviceInfo`). Use `rescan=1` or `live=1` for a **full**
        reconcile including `RescanDevices`. Scans can take tens of seconds on slow
        buses; the server may respond with **504** after about 50s. Use `GET /api/bus/state`
        for `stale`, `last_full_scan_at`, and `scan_in_progress`.
      operationId: getDevices
      parameters:
        - name: live
          in: query
          description: Force immediate full reconcile (same as rescan=1)
          required: false
          schema:
            type: string
            enum: ['1', 'true']
        - name: rescan
          in: query
          description: Force a full bus reconcile before returning (1 or true)
          required: false
          schema:
            type: string
            enum: ['1', 'true', 'false']
      responses:
        '200':
          description: Devices retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                status: success
                message: Devices retrieved
                data:
                  - logical_address: 0
                    address_name: TV
                    physical_address: 0.0.0.0
                    device_type: TV
                    hdmi_port: 0
                    vendor_id: "0x0000F0"
                    vendor_name: Samsung
                    cec_version: "1.4"
                    power_status: On
                    osd_name: TV
                    menu_language: eng
                    is_active: true
                    is_active_source: false
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: Bus steward queue full
        '504':
          description: Scan timed out (server limit ~50s; allow longer client timeouts)

  /bus/state:
    get:
      tags: [Bus]
      summary: Bus steward snapshot
      description: |
        Cached CEC bus state including `devices` (same shape as `GET /api/devices`),
        `active_source`, `logical_addresses`, `stale`, `scan_in_progress`, and optional
        `recent_frames` when `bus.frame_ring_size` is set in `config.json` (captures
        decoded frames from `OnCommand`; can be CPU-heavy combined with `monitor: true`
        or `-cec-monitor`).
      operationId: getBusState
      responses:
        '200':
          description: Bus state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /bus/scan:
    post:
      tags: [Bus]
      summary: Queue deep bus scan
      description: |
        Accepts immediately (HTTP 202) and runs an extended reconcile: RescanDevices,
        extra settle (`bus.deep_settle_ms`), full enumeration, optional **Give*** probe
        transmits per device, then a broadcast Give Physical Address. Poll
        `GET /api/bus/state` until `scan_in_progress` is false. Vendor-specific skips:
        `bus.vendor_profiles` in `config.json`.
      operationId: postBusScan
      responses:
        '202':
          description: Deep scan queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '503':
          description: Steward queue full
        '500':
          $ref: '#/components/responses/InternalError'

  /bus/frames:
    get:
      tags: [Bus]
      summary: Recent captured CEC frames
      description: |
        Returns entries from the ring buffer populated when `bus.frame_ring_size` > 0
        (each `OnCommand` callback appends a row). Independent of libCEC monitoring
        verbosity; use together with `bus.monitor` or `-cec-monitor` to see traffic.
      operationId: getBusFrames
      responses:
        '200':
          description: Frame list (may be empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /devices/{address}:
    get:
      tags: [Devices]
      summary: Get device by logical address
      description: Get detailed information about a specific CEC device.
      operationId: getDevice
      parameters:
        - $ref: '#/components/parameters/LogicalAddress'
      responses:
        '200':
          description: Device info retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /power/on:
    post:
      tags: [Power]
      summary: Power on TV
      description: Power on the TV (logical address 0).
      operationId: powerOn
      responses:
        '200':
          description: Power on command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /power/on/{address}:
    post:
      tags: [Power]
      summary: Power on device
      description: Power on a specific device by logical address.
      operationId: powerOnAddress
      parameters:
        - $ref: '#/components/parameters/LogicalAddress'
      responses:
        '200':
          description: Power on command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /power/off:
    post:
      tags: [Power]
      summary: Power off TV
      description: Put the TV (logical address 0) in standby.
      operationId: powerOff
      responses:
        '200':
          description: Standby command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /power/off/{address}:
    post:
      tags: [Power]
      summary: Power off device
      description: Put a specific device in standby.
      operationId: powerOffAddress
      parameters:
        - $ref: '#/components/parameters/LogicalAddress'
      responses:
        '200':
          description: Standby command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /power/status:
    get:
      tags: [Power]
      summary: Get TV power status
      description: Get power status of the TV (logical address 0).
      operationId: getPowerStatus
      responses:
        '200':
          description: Power status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                status: success
                message: Power status retrieved
                data:
                  address: 0
                  status: On
        '500':
          $ref: '#/components/responses/InternalError'

  /power/status/{address}:
    get:
      tags: [Power]
      summary: Get device power status
      description: Get power status of a specific device.
      operationId: getPowerStatusAddress
      parameters:
        - $ref: '#/components/parameters/LogicalAddress'
      responses:
        '200':
          description: Power status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /volume/up:
    post:
      tags: [Volume]
      summary: Volume up
      description: |
        Without `{address}`: enables **Set System Audio Mode ON** toward the TV, then
        sends **User Control** volume up to logical addresses **5** (audio), **0** (TV),
        then playback roles, then falls back to **libcec** volume. With `{address}`:
        volume key only to that device.
      operationId: volumeUp
      responses:
        '200':
          description: Volume up command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /volume/up/{address}:
    post:
      tags: [Volume]
      summary: Volume up to specific device
      description: Send volume up key press to a specific device by logical address.
      operationId: volumeUpAddress
      parameters:
        - $ref: '#/components/parameters/LogicalAddress'
      responses:
        '200':
          description: Volume up sent to device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /volume/down:
    post:
      tags: [Volume]
      summary: Volume down
      description: Same strategy as `POST /volume/up` (SAM nudge, then keys, then libcec).
      operationId: volumeDown
      responses:
        '200':
          description: Volume down command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /volume/down/{address}:
    post:
      tags: [Volume]
      summary: Volume down to specific device
      description: Send volume down key press to a specific device by logical address.
      operationId: volumeDownAddress
      parameters:
        - $ref: '#/components/parameters/LogicalAddress'
      responses:
        '200':
          description: Volume down sent to device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /volume/mute:
    post:
      tags: [Volume]
      summary: Toggle mute
      description: Same pass-through order as volume, then **libcec** mute toggle.
      operationId: volumeMute
      responses:
        '200':
          description: Mute toggle command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /volume/mute/{address}:
    post:
      tags: [Volume]
      summary: Toggle mute on specific device
      description: Send mute key press to a specific device by logical address.
      operationId: volumeMuteAddress
      parameters:
        - $ref: '#/components/parameters/LogicalAddress'
      responses:
        '200':
          description: Mute sent to device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /source/active:
    get:
      tags: [Source]
      summary: Get active source
      description: Get the currently active source (device that is displaying).
      operationId: getActiveSource
      responses:
        '200':
          description: Active source retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                status: success
                message: Active source retrieved
                data:
                  address: 4
                  name: Playback Device 1
        '500':
          $ref: '#/components/responses/InternalError'

  /source/{address}:
    post:
      tags: [Source]
      summary: Switch to device
      description: |
        Switch to a specific device by logical address. Powers on the device
        if in standby and sends Set Stream Path.
      operationId: setActiveSource
      parameters:
        - $ref: '#/components/parameters/LogicalAddress'
      responses:
        '200':
          description: Switched to device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /hdmi/{port}:
    post:
      tags: [Source]
      summary: Switch to HDMI port
      description: Switch TV input to a specific HDMI port (1-15).
      operationId: setHDMIPort
      parameters:
        - name: port
          in: path
          required: true
          description: HDMI port number (1-15)
          schema:
            type: integer
            minimum: 1
            maximum: 15
      responses:
        '200':
          description: Switched to HDMI port
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /key:
    post:
      tags: [Navigation]
      summary: Send key press
      description: |
        Send a key press (press and release) to a device. Provide either
        `key` (name) or `keycode` (0-255). For keycode 0 (Select), use
        `"key": "select"`.
      operationId: sendKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KeyRequest'
            examples:
              byKey:
                summary: By key name
                value:
                  address: 4
                  key: up
              byKeycode:
                summary: By keycode
                value:
                  address: 4
                  keycode: 0
      responses:
        '200':
          description: Key command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /command:
    post:
      tags: [Raw]
      summary: Send raw CEC command
      description: |
        Send a raw CEC command. Initiator and destination are logical
        addresses (0-15). Opcode is 0-255. Parameters are optional; max 14 bytes.
      operationId: sendCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandRequest'
            example:
              initiator: 1
              destination: 0
              opcode: 143
              parameters: []
      responses:
        '200':
          description: Raw command sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /topology:
    get:
      tags: [System]
      summary: Get CEC bus topology
      description: |
        Get the CEC bus topology including own logical addresses, own HDMI port,
        known port count, and active ports with their connected devices.
      operationId: getTopology
      responses:
        '200':
          description: Bus topology retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                status: success
                message: Bus topology retrieved
                data:
                  own_addresses: [1]
                  own_port: 1
                  known_port_count: 3
                  active_ports:
                    - port: 1
                      devices: ["CEC Bridge"]
                    - port: 2
                      devices: ["Fire TV"]
        '500':
          $ref: '#/components/responses/InternalError'

  /audio/status:
    get:
      tags: [System]
      summary: Get audio status
      description: Get the current volume level and mute state from the audio system.
      operationId: getAudioStatus
      responses:
        '200':
          description: Audio status retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                status: success
                message: Audio status retrieved
                data:
                  volume: 45
                  muted: false
                  volume_raw: 45
                  raw_status: 69
        '500':
          $ref: '#/components/responses/InternalError'

  /logs:
    get:
      tags: [System]
      summary: Get recent logs
      description: |
        Recent log lines from libCEC (traffic, notices, errors) plus application-level entries (level `APP`)
        from HTTP/MQTT actions. Ring buffer holds up to 500 entries; newest last in the JSON array.
      operationId: getLogs
      responses:
        '200':
          description: Logs retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                status: success
                message: Logs retrieved
                data:
                  - level: APP
                    timestamp: "2026-02-12T10:30:45Z"
                    message: "[http] listening on :8080 version=v1.0.0"
                  - level: NOTICE
                    timestamp: "2026-02-12T10:30:46Z"
                    message: CEC connection opened
        '500':
          $ref: '#/components/responses/InternalError'

  /events:
    get:
      tags: [System]
      summary: Server-Sent Events stream
      description: |
        Real-time stream of CEC bus events using Server-Sent Events (SSE).
        Events are JSON objects with `type`, `timestamp`, and `data` fields.
        Event types: `power_change`, `source_activated`, `key_press`, `command`, `alert`,
        `devices_changed` (after a debounced bus rescan; payload includes `logical_addresses`),
        `configuration_changed` (libCEC client config), `adapter_state` (`connected` / `disconnected`).
        Sends a keepalive comment every 15 seconds.
      operationId: getEvents
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                data: {"type":"power_change","timestamp":"2026-02-12T10:30:45Z","data":{"address":0,"status":"on"}}
                data: {"type":"devices_changed","timestamp":"2026-02-12T10:31:02Z","data":{"reason":"bus_topology","logical_addresses":[0,1,4]}}
        '500':
          $ref: '#/components/responses/InternalError'

  /events/ws:
    get:
      tags: [System]
      summary: WebSocket stream for the embedded HTMX UI
      description: |
        Upgrades to a WebSocket (`ws://` or `wss://` matching the page origin).
        Text frames are **HTML** fragments with `hx-swap-oob` targets used by htmx 1.x
        `hx-ws` (live event log, bus banner, and selective panel refreshes).
        For JSON event payloads and scripts, use `GET /events` (Server-Sent Events) instead.
      operationId: getEventsWebSocket
      responses:
        '101':
          description: Switching Protocols — WebSocket per RFC 6455 (response not JSON)
        '400':
          description: Bad upgrade request
        '500':
          $ref: '#/components/responses/InternalError'

  /health:
    get:
      tags: [System]
      summary: Health check
      description: Service health, version, and libcec version information.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                status: success
                message: Service is healthy
                data:
                  version: v20260212.143000-abc1234
                  libcec: "libCEC version 6.0.2"

  /update:
    post:
      tags: [System]
      summary: Trigger self-update
      description: |
        Check for a new release on GitHub and install it. Downloads the new
        binary and web UI, then restarts the systemd service. Returns the
        old and new version on success. If already up to date, returns the
        current version.
      operationId: triggerUpdate
      responses:
        '200':
          description: Update check completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                updated:
                  summary: Update installed
                  value:
                    status: success
                    message: "Updated to v20260212.150000-def5678, restarting..."
                    data:
                      old_version: v20260212.143000-abc1234
                      new_version: v20260212.150000-def5678
                upToDate:
                  summary: Already up to date
                  value:
                    status: success
                    message: Already up to date
                    data:
                      version: v20260212.143000-abc1234
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          description: GitHub API unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  /settings/mqtt:
    get:
      tags: [Settings]
      summary: Get MQTT settings
      description: |
        Get the current MQTT broker configuration and connection status.
        The password is masked as `"***"` if set, or `""` if empty.
      operationId: getMQTTSettings
      responses:
        '200':
          description: MQTT settings retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                status: success
                message: MQTT settings
                data:
                  broker: "tcp://localhost:1883"
                  user: ha
                  pass: "***"
                  prefix: capi
                  connected: true
    post:
      tags: [Settings]
      summary: Update MQTT settings
      description: |
        Update the MQTT broker configuration. Settings are persisted to
        `config.json` next to the binary. If a broker URL is provided, the
        service connects (or reconnects) to the broker. If the broker is
        empty, MQTT is disabled and disconnected.

        To keep the existing password without changing it, send `"***"` as
        the password value.
      operationId: postMQTTSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MQTTSettingsRequest'
            example:
              broker: "tcp://localhost:1883"
              user: ha
              pass: secret
              prefix: capi
      responses:
        '200':
          description: MQTT settings saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                status: success
                message: MQTT settings saved
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    LogicalAddress:
      name: address
      in: path
      required: true
      description: CEC logical address (0-15). 0=TV, 1=Rec 1, 2=Rec 2, 3=Tuner 1, 4=Playback 1, 5=Audio, etc.
      schema:
        type: integer
        minimum: 0
        maximum: 15

  schemas:
    ApiResponse:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [success, error]
        message:
          type: string
          description: Human-readable message
        data:
          description: Response payload (varies by endpoint)
          nullable: true

    Device:
      type: object
      properties:
        logical_address:
          type: integer
          minimum: 0
          maximum: 15
        address_name:
          type: string
          example: TV
        physical_address:
          type: string
          example: "0.0.0.0"
        device_type:
          type: string
          description: CEC device type
          example: TV
        hdmi_port:
          type: integer
          description: HDMI port number derived from physical address (0 if not applicable)
          example: 1
        vendor_id:
          type: string
          example: "0x0000F0"
        vendor_name:
          type: string
        cec_version:
          type: string
        power_status:
          type: string
          enum: [On, Standby, "Transitioning to On", "Transitioning to Standby", Unknown]
        osd_name:
          type: string
        menu_language:
          type: string
        is_active:
          type: boolean
        is_active_source:
          type: boolean

    TopologyResponse:
      type: object
      properties:
        own_addresses:
          type: array
          items:
            type: integer
          description: Logical addresses owned by this adapter
        own_port:
          type: integer
          description: HDMI port this adapter is connected to
        known_port_count:
          type: integer
          description: Number of known HDMI ports on the TV
        active_ports:
          type: array
          items:
            $ref: '#/components/schemas/PortDetail'

    PortDetail:
      type: object
      properties:
        port:
          type: integer
          description: HDMI port number
        devices:
          type: array
          items:
            type: string
          description: OSD names of devices on this port

    AudioStatus:
      type: object
      properties:
        volume:
          type: integer
          minimum: 0
          maximum: 100
          description: Volume percentage for UI (clamped to 0–100 when CEC reports >100)
        volume_raw:
          type: integer
          minimum: 0
          maximum: 255
          description: Raw volume byte from CEC `Report Audio Status` (0–100 typical; some devices send higher)
        raw_status:
          type: integer
          minimum: 0
          maximum: 255
          description: Full first status byte from libCEC (includes mute bit in high nibble per CEC spec)
        muted:
          type: boolean
          description: Whether audio is muted

    MQTTSettingsResponse:
      type: object
      properties:
        broker:
          type: string
          description: MQTT broker URL
          example: "tcp://localhost:1883"
        user:
          type: string
          description: MQTT username
        pass:
          type: string
          description: Masked password ("***" if set, "" if empty)
        prefix:
          type: string
          description: MQTT topic prefix
          example: capi
        connected:
          type: boolean
          description: Whether the MQTT client is currently connected

    MQTTSettingsRequest:
      type: object
      properties:
        broker:
          type: string
          description: MQTT broker URL (empty to disable MQTT)
          example: "tcp://localhost:1883"
        user:
          type: string
          description: MQTT username (optional)
        pass:
          type: string
          description: MQTT password (send "***" to keep existing password)
        prefix:
          type: string
          description: MQTT topic prefix (defaults to "capi" if empty)
          example: capi

    KeyRequest:
      type: object
      required: [address]
      properties:
        address:
          type: integer
          minimum: 0
          maximum: 15
          description: Target device logical address
        key:
          type: string
          description: Key name (use when keycode is not provided)
          enum:
            - up
            - down
            - left
            - right
            - select
            - enter
            - back
            - home
            - menu
            - play
            - pause
            - stop
        keycode:
          type: integer
          minimum: 0
          maximum: 255
          description: Raw CEC keycode (use for keycode 0 = Select or other codes)
      oneOf:
        - required: [key]
        - required: [keycode]

    CommandRequest:
      type: object
      required: [initiator, destination, opcode]
      properties:
        initiator:
          type: integer
          minimum: 0
          maximum: 15
          description: Source logical address
        destination:
          type: integer
          minimum: 0
          maximum: 15
          description: Target logical address
        opcode:
          type: integer
          minimum: 0
          maximum: 255
          description: CEC opcode
        parameters:
          type: array
          maxItems: 14
          items:
            type: integer
            minimum: 0
            maximum: 255
          default: []

    LogMessage:
      type: object
      properties:
        level:
          type: string
          enum: [ERROR, WARNING, NOTICE, TRAFFIC, DEBUG]
        timestamp:
          type: string
          format: date-time
        message:
          type: string

  responses:
    BadRequest:
      description: Invalid parameters or request body
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            status: error
            message: Invalid logical address
    InternalError:
      description: CEC operation failed or server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            status: error
            message: failed to open adapter
