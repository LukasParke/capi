[package]
name = "capi"
version = "0.2.0"
edition = "2021"
description = "HDMI-CEC control over HTTP and MQTT"
license = "MIT"

[features]
mock-cec = []

[lib]
name = "capi"
path = "src/lib.rs"

[[bin]]
name = "capi"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs", "process"] }
axum = { version = "0.8", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
askama = "0.14"
rumqttc = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.10"
hex = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde", "clock"] }

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking", "json"] }
tokio-tungstenite = "0.24"
serial_test = "3"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
