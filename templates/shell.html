<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{% block title %}capi{% endblock title %}</title>
  <link rel="stylesheet" href="/ui/static/style.css">
  <script src="/ui/static/htmx.min.js" defer></script>
  <script src="/ui/static/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="capi home">
        <svg class="brand-mark" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <rect x="1.5" y="1.5" width="17" height="17" rx="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M4.5 10h3l1.6-4 2.4 8 1.6-4h2.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="brand-name">capi</span>
        <span class="brand-version mono">{{ version }}</span>
      </a>
      <nav class="topnav" aria-label="Primary">
        <a href="/">Dashboard</a>
        <a href="/settings">Settings</a>
        <a href="/dev">Dev</a>
      </nav>
      <button class="btn btn-ghost btn-icon" type="button" data-action="toggle-theme" aria-label="Toggle color theme">
        <svg class="icon-theme icon-sun" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <circle cx="10" cy="10" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
          <path d="M10 1.8v2M10 16.2v2M1.8 10h2M16.2 10h2M4.3 4.3l1.4 1.4M14.3 14.3l1.4 1.4M15.7 4.3l-1.4 1.4M5.7 14.3l-1.4 1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
        <svg class="icon-theme icon-moon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
          <path d="M16.5 12.2A7 7 0 0 1 7.8 3.5a7 7 0 1 0 8.7 8.7Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>
  <main id="main" class="container">
    {% block content %}{% endblock content %}
  </main>
  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
</body>
</html>
